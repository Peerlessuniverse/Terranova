# fly.toml app configuration file generated for terranova-4jahiw on 2026-11-28T08:01:15Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'terranova-4jahiw'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TN_DB_PATH = '/data/gaia.sqlite3'
  TN_HOST = '0.0.0.0'

[[mounts]]
  source = 'tn_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
